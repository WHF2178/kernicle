[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernicle-ai"
version = "0.1.0"
description = "AI-powered analysis plugin for Kernicle - adds intelligent diagnostics and fix recommendations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Logging",
]
keywords = ["linux", "logs", "kernel", "ai", "llm", "diagnostics"]

dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/kernicle/kernicle-ai"
Documentation = "https://github.com/kernicle/kernicle-ai#readme"
Repository = "https://github.com/kernicle/kernicle-ai.git"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."kernicle.plugins"]
ai = "kernicle_ai:AIPlugin"
